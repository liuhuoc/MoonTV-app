name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: '后端服务器地址（如 https://myserver.com），留空则仅打包前端UI'
        required: false
        type: string

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 git 历史来计算 versionCode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install

      - name: Build web assets
        run: pnpm build
        env:
          CAPACITOR: 'true'

      - name: Capacitor sync
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.CAPACITOR_SERVER_URL || '' }}

      - name: Generate release keystore (if not exists)
        run: |
          cd android
          if [ ! -f moontv-release-key.keystore ]; then
            keytool -genkey -v -keystore moontv-release-key.keystore -alias moontv -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass moontv123 -keypass moontv123 \
              -dname "CN=MoonTV, OU=MoonTV, O=MoonTV, L=Beijing, ST=Beijing, C=CN"
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moontv-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
