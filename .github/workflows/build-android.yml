name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: '后端服务器地址（如 https://myserver.com），留空则仅打包前端UI'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 git 历史来计算 versionCode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install

      - name: Build web assets
        run: pnpm build
        env:
          CAPACITOR: 'true'

      - name: Capacitor sync
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.CAPACITOR_SERVER_URL || '' }}

      # ── 自动递增版本号（基于 git commit 数） ───────────────────
      - name: Compute version info
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date +'%Y%m%d')
          DISPLAY_DATE=$(date +'%Y-%m-%d')
          VERSION="1.0.${COMMIT_COUNT}"
          RELEASE_NAME="v${VERSION} - ${DISPLAY_DATE}"
          APK_NAME="MoonTV-v${VERSION}-${SHORT_SHA}.apk"

          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "display_date=${DISPLAY_DATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Release: ${RELEASE_NAME}"

      # ── 构建 Release APK（使用正式签名） ──────────────────────
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare signed APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/${{ steps.version.outputs.apk_name }}"

      # ── 创建 GitHub Release 并上传 APK ────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ## MoonTV ${{ steps.version.outputs.release_name }}

            **Commit:** ${{ github.sha }}
            **Build Date:** ${{ steps.version.outputs.display_date }}
            **Version Code:** ${{ steps.version.outputs.commit_count }}

            ### 安装说明
            下载下方 APK 文件，在 Android 设备上允许「未知来源」安装后即可使用。
          files: release/*.apk
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 同时保留 Artifact 备份 ────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moontv-release-apk
          path: release/*.apk
          retention-days: 30
